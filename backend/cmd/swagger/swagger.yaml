        in: query
        name: displayName
        type: string
      - description: Айди в соц. сети
        in: query
        name: socialId
        type: string
      - default: false
        description: Если в true, тогда будет условие AND
        in: query
        name: matchAll
        type: boolean
      - default: false
        description: Если в true, тогда строгое сравнение
        in: query
        name: strict
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserModel'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.UnauthorizedError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.NotFoundError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/responses.ValidationError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/responses.RateLimitError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.InternalError'
      security:
      - ApiKeyAuth: []

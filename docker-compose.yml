name: "pastcollection"

services:
  pastcollection-backend:
    container_name: pastcollection-backend
    volumes:
      - ./backend:/app
    build:
      dockerfile: ./backend/Dockerfile
      args:
        - APP_ENV=$APP_ENV
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - pastcollection-postgres

  pastcollection-bot:
    container_name: pastcollection-bot
    network_mode: host
    env_file:
      - .env
    build:
      dockerfile: ./client/Dockerfile
      args:
        - APP_ENV=$APP_ENV
    volumes:
      - ./client:/app
    depends_on:
      - pastcollection-backend

  pastcollection-postgres:
    container_name: pastcollection-postgres
    image: postgres:17.5-alpine
    restart: always
    environment:
      PGDATA: /pgdata
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/pgdata
    ports:
      - "5432:5432"

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      device: ./var/storage/postgres_data
      o: bind
